<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Jornexa</title>
  <desc id="desc">Logotipo vectorial de Jornexa: una J formada por una red de conexiones.</desc>
  <defs>
    <linearGradient id="jornexaBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#072E73"/>
      <stop offset="1" stop-color="#0A3D91"/>
    </linearGradient>
  </defs>

  <!-- Marca: una J operativa formada por nodos conectados. -->
  <g transform="translate(20 24)">
    <path d="M24 20v51c0 25 14 40 38 40 18 0 33-8 43-24" fill="none" stroke="url(#jornexaBlue)" stroke-width="13" stroke-linecap="round"/>
    <path d="M24 20L87 45 94 91" fill="none" stroke="#0A3D91" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 111L87 45" fill="none" stroke="#21D4E8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="24" cy="20" r="9" fill="#072E73"/>
    <circle cx="87" cy="45" r="9" fill="#0A3D91"/>
    <circle cx="94" cy="91" r="9" fill="#0A3D91"/>
    <circle cx="62" cy="111" r="9" fill="#21D4E8"/>
  </g>

  <!-- Nombre: el azul identifica la inicial; el resto preserva una lectura elegante. -->
  <text x="158" y="94" fill="#0A3D91" font-family="Quicksand, Avenir Next, Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">J<tspan fill="#1D1F24">ornexa</tspan></text>
  <rect x="162" y="116" width="502" height="2" rx="1" fill="#D9E7F1"/>
  <text x="164" y="145" fill="#0A3D91" font-family="Quicksand, Avenir Next, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">GESTIÓN CONECTADA</text>
</svg>
