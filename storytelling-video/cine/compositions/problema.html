  <script>
    const SH = [{"s": 1.6, "d": 5.85}, {"s": 7.45, "d": 5.1}, {"s": 12.55, "d": 3.67}];
    const DUR = 17.22;
    const A = {"sedes": 9.65, "mensajes": 10.65, "papel": 12.65, "titulo": 14.05};

    const tl = gsap.timeline({ paused: true });
    const E = (id) => '#' + id;
    function placa(id, t, fin) {
      tl.fromTo(E(id), { opacity: 0, x: -150, scale: 1.04 }, { opacity: 1, x: 0, scale: 1, duration: 0.38, ease: 'power4.out' }, t);
      if (fin !== null) tl.to(E(id), { opacity: 0, x: -50, duration: 0.25, ease: 'power2.in' }, fin - 0.25);
    }
    function llamada(id, t, fin) {
      tl.fromTo(E(id), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.8)' }, t);
      tl.fromTo(E(id), { boxShadow: '0 0 0 3px #072E73' }, { boxShadow: '0 0 0 14px rgba(33,212,232,0.0)', duration: 0.5, ease: 'power2.out' }, t + 0.35);
      if (fin !== null) tl.to(E(id), { opacity: 0, duration: 0.25, ease: 'power2.in' }, fin - 0.25);
    }
    function camara(id, t, d, z0, z1, origen) {
      tl.fromTo(E(id), { scale: z0, transformOrigin: origen }, { scale: z1, transformOrigin: origen, duration: d, ease: 'none' }, t);
    }

    const rot = { 'pr-1': -4, 'pr-2': 3, 'pr-3': -2, 'pr-4': -3, 'pr-5': 4, 'pr-6': -2 };
    const aparece = (id, t) => tl.fromTo(E(id), { opacity: 0, scale: 0.6, rotation: rot[id] - 14, y: 90 }, { opacity: 1, scale: 1, rotation: rot[id], y: 0, duration: 0.42, ease: 'back.out(2)' }, t);
    // cámara en mano: empuje lento y leve giro durante toda la escena
    tl.fromTo('#cam', { scale: 1.0, rotation: -1.2, transformOrigin: '50% 55%' }, { scale: 1.16, rotation: 1.4, transformOrigin: '50% 55%', duration: A.titulo, ease: 'power1.in' }, 0);
    aparece('pr-2', SH[0].s + 1.5); aparece('pr-3', SH[0].s + 3.6);
    aparece('pr-4', A.sedes); aparece('pr-5', A.mensajes); aparece('pr-6', A.papel);
    // "nadie que vea el panorama completo": todo se apaga y cae el titular

    tl.fromTo('#pr-titulo', { opacity: 0, scale: 1.5, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'power4.out' }, A.titulo + 0.05);
    tl.fromTo('#pr-barra', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power3.out' }, A.titulo + 0.35);
    // salida: el titular se lanza contra la cámara y todo se vuelve blanco
    tl.to('#pr-titulo', { scale: 2.6, duration: 0.5, ease: 'power3.in' }, DUR - 0.55);
    tl.to('#pr-blanco', { opacity: 1, duration: 0.3, ease: 'power2.in' }, DUR - 0.35);

    window.__timelines["problema"] = tl;
