<template>
  <style>

    .etq { position: absolute; left: 215px; font-size: 84px; font-weight: 700; color: #072E73; white-space: nowrap; line-height: 1; }

  <div id="root" data-composition-id="jornexa" data-width="1080" data-height="1920">

    <div id="jx-halo" data-layout-allow-overflow></div>
    <div id="jx-plano" data-layout-allow-overflow><img id="jx-logo" src="assets/jornexa-logo.svg" alt="Jornexa · Gestión Conectada"><div id="jx-barrido"></div></div>

  <script>
    const SH = __SHOTS__;
    const DUR = __DUR__;
    const A = __ANC__;

    const tl = gsap.timeline({ paused: true });
    const E = (id) => '#' + id;
    function placa(id, t, fin) {
      tl.fromTo(E(id), { opacity: 0, x: -150, scale: 1.04 }, { opacity: 1, x: 0, scale: 1, duration: 0.38, ease: 'power4.out' }, t);
      if (fin !== null) tl.to(E(id), { opacity: 0, x: -50, duration: 0.25, ease: 'power2.in' }, fin - 0.25);
    }
    function llamada(id, t, fin) {
      tl.fromTo(E(id), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.8)' }, t);
      tl.fromTo(E(id), { boxShadow: '0 0 0 3px #072E73' }, { boxShadow: '0 0 0 14px rgba(33,212,232,0.0)', duration: 0.5, ease: 'power2.out' }, t + 0.35);
      if (fin !== null) tl.to(E(id), { opacity: 0, duration: 0.25, ease: 'power2.in' }, fin - 0.25);
    }
    function camara(id, t, d, z0, z1, origen) {
      tl.fromTo(E(id), { scale: z0, transformOrigin: origen }, { scale: z1, transformOrigin: origen, duration: d, ease: 'none' }, t);
    }

    tl.set('#jx-linea', { scaleY: 0, transformOrigin: '50% 0%' }, 0);
    // viene del blanco (la escena anterior termina blanca)
    tl.fromTo('#jx-blanco', { opacity: 0 }, { opacity: 1, duration: 0.22, ease: 'power2.in' }, 0);
    tl.to('#jx-blanco', { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.3);
    tl.fromTo('#jx-logo', { scale: 1.35, opacity: 0.0, transformOrigin: '50% 50%' }, { scale: 1, opacity: 1, duration: 0.7, ease: 'power3.out', transformOrigin: '50% 50%' }, 0.2);
    tl.fromTo('#jx-barrido', { x: 0 }, { x: 1500, duration: 0.9, ease: 'power2.inOut' }, 0.75);
    tl.fromTo('#jx-sub', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 1.8);
    tl.to('#jx-plano', { scale: 1.05, transformOrigin: '0% 50%', duration: Math.max(1, SH[1].s - 1.2), ease: 'none' }, 1.0);
    // "Datos, contexto, decisión y acción": cada palabra enciende su nodo
    tl.fromTo('#jx-linea', { scaleY: 0 }, { scaleY: 1, duration: A.n3 - A.n0 + 0.6, ease: 'none', transformOrigin: '50% 0%' }, A.n0 - 0.1);
    ['n0', 'n1', 'n2', 'n3'].forEach((k, i) => {
      tl.fromTo('#nd-' + i, { scale: 0 }, { scale: 1, duration: 0.3, ease: 'back.out(2.4)' }, A[k]);
      tl.fromTo('#et-' + i, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out' }, A[k] + 0.03);
    });
    // salida: zoom a través del logotipo
    tl.to('#root', { scale: 2.6, opacity: 0, transformOrigin: '50% 22%', duration: 0.5, ease: 'power3.in' }, DUR - 0.5);

    window.__timelines["jornexa"] = tl;
  </script>
